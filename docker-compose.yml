services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./outputs:/app/outputs
    environment:
      - OLLAMA_HOST=http://host.docker.internal:11434
      - CLOUD_LLM_API_KEY=${CLOUD_LLM_API_KEY}
    extra_hosts:
      - "host.docker.internal:host-gateway"   # needed on Linux hosts; no-op on Windows/Mac

  streamlit:
    build: ./streamlit_app
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
